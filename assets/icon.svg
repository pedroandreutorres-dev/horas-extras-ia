<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado estilo Android -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Aro exterior sutil -->
  <circle cx="236" cy="268" r="154" fill="none" stroke="#334155" stroke-width="18"/>

  <!-- Arco de progreso de horas extras -->
  <circle cx="236" cy="268" r="154" fill="none" stroke="url(#accentGrad)" stroke-width="20"
          stroke-linecap="round" stroke-dasharray="680 968" transform="rotate(-90 236 268)"/>

  <!-- Barras ascendentes de analítica dentro del reloj -->
  <rect x="160" y="294" width="34" height="58" rx="10" fill="#38bdf8" opacity="0.75"/>
  <rect x="208" y="250" width="34" height="102" rx="10" fill="#60a5fa" opacity="0.9"/>
  <rect x="256" y="202" width="34" height="150" rx="10" fill="url(#accentGrad)"/>

  <!-- Manecillas estilizadas del reloj -->
  <line x1="236" y1="268" x2="236" y2="162" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  <line x1="236" y1="268" x2="310" y2="268" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  <circle cx="236" cy="268" r="14" fill="#f8fafc"/>

  <!-- Destello IA (Gemini Sparkle) -->
  <path d="M396 86 C396 124 410 138 448 138 C410 138 396 152 396 190 C396 152 382 138 344 138 C382 138 396 124 396 86 Z"
        fill="url(#sparkGrad)"/>
</svg>
